<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess.com Stockfish Advisor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-root">
      <header class="popup-header">
        <div>
          <h1 class="popup-title">Chess.com Stockfish Advisor</h1>
          <p class="popup-sub">Stockfish 19 WASM · 로컬 실시간 분석</p>
        </div>
        <button id="btn-enabled" class="toggle-btn" type="button">활성</button>
      </header>

      <section class="card">
        <div class="eval-header">
          <div>
            <span class="label">평가 점수</span>
            <div id="eval-score" class="eval-value">--</div>
          </div>
          <div class="align-right">
            <span class="label">추천 최선수</span>
            <div id="best-move" class="best-move">--</div>
          </div>
        </div>
        <div class="meta-line">
          <span id="turn-label">차례: -</span>
          <span>·</span>
          <span id="depth-label">탐색 깊이: -</span>
        </div>
        <ul id="pv-list" class="pv-list">
          <li class="pv-empty">Chess.com 보드를 열거나 아래에 FEN을 입력하세요.</li>
        </ul>
      </section>

      <section class="card">
        <div class="control-row">
          <label for="input-depth">탐색 깊이 (Depth): <strong id="depth-val">14</strong></label>
          <input id="input-depth" type="range" min="6" max="20" step="1" value="14" />
        </div>

        <div class="control-row">
          <label for="select-multipv">후보 수 개수 (MultiPV)</label>
          <select id="select-multipv">
            <option value="1">1개 (최선수만)</option>
            <option value="2" selected>2개</option>
            <option value="3">3개</option>
          </select>
        </div>

        <div class="checkbox-row">
          <label><input id="chk-arrow" type="checkbox" checked /> 보드 화살표 오버레이 표시</label>
          <label><input id="chk-hud" type="checkbox" checked /> 우측 하단 HUD 표시</label>
        </div>
      </section>

      <section class="card">
        <label class="label" for="fen-input">현재 FEN / 직접 분석 테스트</label>
        <div class="fen-row">
          <input id="fen-input" type="text" placeholder="rnbqkbnr/pppppppp/8/8/..." />
          <button id="btn-analyze-fen" type="button" class="secondary-btn">분석</button>
        </div>
      </section>

      <footer class="popup-footer">
        분석 및 복기 학습용입니다. 공정 플레이 정책을 준수하세요.
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
